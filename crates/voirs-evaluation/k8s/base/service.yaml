# VoiRS Evaluation Services
# Kubernetes service definitions for coordinator and workers

---
apiVersion: v1
kind: Service
metadata:
  name: voirs-evaluation-coordinator
  labels:
    app: voirs-evaluation
    component: coordinator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: voirs-evaluation
    component: coordinator
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
apiVersion: v1
kind: Service
metadata:
  name: voirs-evaluation-worker
  labels:
    app: voirs-evaluation
    component: worker
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet-like behavior
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: voirs-evaluation
    component: worker
  publishNotReadyAddresses: true  # Allow discovery of not-ready pods

---
apiVersion: v1
kind: Service
metadata:
  name: voirs-evaluation-api
  labels:
    app: voirs-evaluation
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: "evaluation.voirs.example.com"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  selector:
    app: voirs-evaluation
    component: coordinator
  sessionAffinity: ClientIP
  loadBalancerSourceRanges:
  - "0.0.0.0/0"  # Restrict in production
