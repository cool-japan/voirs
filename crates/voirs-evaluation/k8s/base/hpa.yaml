# Horizontal Pod Autoscaler for VoiRS Evaluation Workers
# Automatically scales worker pods based on CPU/memory utilization and custom metrics

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voirs-evaluation-worker-hpa
  labels:
    app: voirs-evaluation
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voirs-evaluation-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU-based autoscaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based autoscaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: Queue depth
  - type: Pods
    pods:
      metric:
        name: voirs_evaluation_queue_depth
      target:
        type: AverageValue
        averageValue: "20"
  # Custom metric: Active tasks per pod
  - type: Pods
    pods:
      metric:
        name: voirs_evaluation_active_tasks
      target:
        type: AverageValue
        averageValue: "8"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
