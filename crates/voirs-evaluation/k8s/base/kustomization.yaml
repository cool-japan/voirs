# Kustomization base configuration for VoiRS Evaluation
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

commonLabels:
  app.kubernetes.io/name: voirs-evaluation
  app.kubernetes.io/version: v0.1.0-alpha.3
  app.kubernetes.io/component: evaluation
  app.kubernetes.io/part-of: voirs

resources:
- deployment.yaml
- service.yaml
- hpa.yaml
- configmap.yaml
- rbac.yaml
- pvc.yaml
- networkpolicy.yaml

configMapGenerator:
- name: voirs-evaluation-env
  literals:
  - RUST_LOG=info
  - ENABLE_METRICS=true
  - METRICS_PORT=9090

images:
- name: voirs/evaluation
  newTag: v0.1.0-alpha.3
