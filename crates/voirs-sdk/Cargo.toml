[package]
name = "voirs-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/voirs-sdk"
keywords = ["voirs", "sdk", "tts", "speech-synthesis", "api"]
categories = ["api-bindings", "multimedia::audio", "science"]
rust-version.workspace = true
description = "Unified SDK and public API for VoiRS speech synthesis"
readme = "README.md"

[lib]
name = "voirs_sdk"
path = "src/lib.rs"

[dependencies]
# SciRS2 - Scientific computing abstractions
scirs2-core.workspace = true
scirs2-fft.workspace = true

# Re-export all core crates
voirs-g2p.workspace = true
voirs-acoustic.workspace = true
voirs-vocoder.workspace = true
voirs-dataset.workspace = true

# New advanced features
voirs-emotion = { workspace = true, optional = true }
voirs-cloning = { workspace = true, optional = true }
voirs-conversion = { workspace = true, optional = true }
voirs-spatial = { workspace = true, optional = true }

# Common dependencies for the unified API
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
async-stream = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hound.workspace = true
toml.workspace = true
fastrand.workspace = true
reqwest.workspace = true
# Pure-Rust TLS provider (rustls + RustCrypto) — re-exported install helper
oxitls-adapter-rustls-rustcrypto.workspace = true
rustls.workspace = true
regex.workspace = true
glob.workspace = true
memmap2.workspace = true
semver.workspace = true
thread_local.workspace = true
pin-project.workspace = true
cpal.workspace = true
backtrace.workspace = true
notify.workspace = true
libc.workspace = true
parking_lot.workspace = true

# Audio codec dependencies
claxon.workspace = true
symphonia.workspace = true
lewton.workspace = true
ogg.workspace = true
# C-FFI codecs (gated behind default-OFF `ffi-codecs` feature to keep default build Pure Rust)
opus = { workspace = true, optional = true }
flac-bound = { workspace = true, optional = true }
minimp3 = { workspace = true, optional = true }
mp3lame-encoder = { workspace = true, optional = true }

# Web Integration dependencies
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
wasm-logger = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
uuid.workspace = true
chrono.workspace = true
num_cpus.workspace = true

# Cloud Integration dependencies
oxiarc-deflate = { workspace = true, optional = true }
oxiarc-zstd = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
oxicode = { workspace = true, optional = true }

# ONNX runtime
oxionnx = { workspace = true, optional = true }

# Plugin loading dependencies
libloading = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
wasm-bindgen-test = "0.3"
tokio-tungstenite = "0.29"
criterion.workspace = true

[features]
default = []
# C-FFI audio codecs (libopus, libFLAC, minimp3, LAME). Default-OFF to keep the
# default build Pure Rust. Propagates to voirs-vocoder and voirs-dataset, which
# also gate their C-FFI codec code behind their own `ffi-codecs` feature.
ffi-codecs = [
    "dep:opus",
    "dep:flac-bound",
    "dep:minimp3",
    "dep:mp3lame-encoder",
    "voirs-vocoder/ffi-codecs",
    "voirs-dataset/ffi-codecs",
]
gpu = ["oxionnx?/gpu", "voirs-acoustic/gpu", "voirs-vocoder/gpu", "voirs-g2p/gpu", "voirs-cloning?/gpu", "voirs-conversion?/gpu", "voirs-emotion?/gpu", "voirs-spatial?/gpu"]
onnx = ["dep:oxionnx", "voirs-acoustic/onnx", "voirs-vocoder/onnx", "voirs-g2p/onnx", "voirs-cloning?/onnx", "voirs-conversion?/onnx", "voirs-emotion?/onnx", "voirs-spatial?/onnx"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "web-sys", "js-sys", "console_error_panic_hook", "wasm-logger"]
http = ["axum", "tower", "tower-http"]
cloud = ["oxiarc-deflate", "oxiarc-zstd", "sha2", "aes-gcm", "oxicode"]
plugins = ["libloading", "wasmtime"]

# Advanced voice features
emotion = ["voirs-emotion"]
cloning = ["voirs-cloning"]
conversion = ["voirs-conversion"]
singing = []
spatial = ["voirs-spatial"]
realtime-conversion = ["conversion", "voirs-conversion/real-time"]
streaming-conversion = ["conversion", "voirs-conversion/streaming"]

# Complete feature sets
voice-cloning = ["cloning", "voirs-cloning/acoustic-integration"]
advanced-emotions = ["emotion", "voirs-emotion/acoustic-integration"]
all-features = ["emotion", "cloning", "conversion", "gpu", "onnx", "http", "cloud", "plugins"]

