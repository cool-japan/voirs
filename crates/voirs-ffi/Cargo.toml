[package]
name = "voirs-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/voirs-ffi"
keywords = ["voirs", "ffi", "python", "bindings", "c-api"]
categories = ["external-ffi-bindings", "multimedia::audio"]
rust-version.workspace = true
description = "C/Python FFI bindings for VoiRS speech synthesis"
readme = "README.md"

[lib]
name = "voirs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core VoiRS crates
voirs-sdk.workspace = true
voirs-g2p.workspace = true
voirs-acoustic.workspace = true
voirs-vocoder.workspace = true
voirs-recognizer = { workspace = true, optional = true }

# Pure-Rust TLS provider (rustls + RustCrypto) — installed at FFI init
oxitls-adapter-rustls-rustcrypto.workspace = true
rustls.workspace = true

# FFI utilities
libc.workspace = true

# Async runtime
tokio.workspace = true
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Memory management
once_cell.workspace = true
backtrace.workspace = true

# Threading
parking_lot.workspace = true
num_cpus.workspace = true
flume.workspace = true
thread_local.workspace = true

# Additional dependencies for new modules
tempfile.workspace = true

# Logging
log.workspace = true

# Python bindings
pyo3 = { workspace = true, features = ["abi3-py38"], optional = true }
numpy = { version = "0.28.0", optional = true }

# Node.js bindings
napi = { version = "3.8", features = ["async"], optional = true }
napi-derive = { version = "3.5", optional = true }

# Platform-specific dependencies for memory detection
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18", optional = true }
alsa = { version = "0.11", optional = true }
pulse = { version = "0.5", optional = true }
dbus = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }
cpal = { version = "0.17", optional = true }
objc = { version = "0.2", optional = true }
objc-foundation = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_System_ProcessStatus", 
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_DirectSound",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Registry",
    "Win32_Media_Multimedia"
] }
winapi = { version = "0.3", optional = true, features = [
    "combaseapi", 
    "mmdeviceapi",
    "objbase",
    "winreg",
    "processthreadsapi",
    "wtypes",
    "oleauto",
    "unknwnbase",
    "guiddef"
] }

# Logging (optional for debugging)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# WebAssembly bindings
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "AudioContext", "AudioBuffer", "Blob"] }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Audio file I/O
hound.workspace = true
md5.workspace = true  # For FLAC MD5 signature generation
# NOTE: MP3 encoding implementation pending - using structured placeholder for now
# NOTE: FLAC encoding enhanced with proper file structure

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
pyo3 = { workspace = true, features = ["auto-initialize", "abi3-py38"] }

[[bench]]
name = "ffi_performance"
harness = false

[[bench]]
name = "cross_language_performance"
path = "benches/ffi/cross_language_performance.rs"
harness = false

[[bench]]
name = "throughput_benchmark"
harness = false

[features]
default = ["memory-detection", "dep:futures", "dep:futures-util"]
logging = ["dep:tracing", "dep:tracing-subscriber"]
python = ["dep:pyo3", "logging", "dep:futures", "dep:futures-util"]
numpy = ["python", "dep:numpy"]
nodejs = ["dep:napi", "dep:napi-derive", "dep:futures", "dep:futures-util"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]
gpu = ["voirs-acoustic/gpu", "voirs-vocoder/gpu"]
memory-detection = ["dep:procfs", "dep:windows"]
recognition = ["dep:voirs-recognizer", "dep:futures", "dep:futures-util"]
python-recognition = ["python", "recognition"]
futures = ["dep:futures", "dep:futures-util"]

# Recognition model features
whisper-pure = ["recognition", "voirs-recognizer/whisper-pure"]

# Platform-specific features
windows-platform = ["dep:windows", "dep:winapi"]
macos-platform = ["dep:core-foundation", "dep:cpal", "dep:objc", "dep:objc-foundation"]
linux-platform = ["dep:procfs", "dep:alsa", "dep:pulse", "dep:dbus"]
platform-integration = ["windows-platform", "macos-platform", "linux-platform"]

[lints]
workspace = true
