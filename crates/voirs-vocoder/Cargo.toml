[package]
name = "voirs-vocoder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/voirs-vocoder"
keywords = ["voirs", "vocoder", "hifi-gan", "neural-audio", "waveform"]
categories = ["multimedia::audio", "science", "algorithms"]
rust-version.workspace = true
description = "Neural vocoder inference for VoiRS (HiFi-GAN/DiffWave)"
readme = "README.md"

[lib]
name = "voirs_vocoder"
crate-type = ["lib"]

[dependencies]
# ML/Tensor libraries
# candle-core/candle-nn are hard (non-optional) dependencies: model modules
# (e.g. models/diffwave/*, models/vits2/*, backends/candle.rs) reference
# candle_core/candle_nn types unconditionally with no feature gate, so the
# crate has never actually been able to compile without them. Making that
# explicit here (instead of advertising a "candle" feature that silently
# can't be disabled) is the honest fix; see the (now-empty) `candle` feature
# below for backward compatibility.
candle-core.workspace = true
candle-nn.workspace = true
oxionnx = { workspace = true, optional = true }
safetensors.workspace = true

# SciRS2 - Optimized DSP and signal processing
scirs2-core.workspace = true
scirs2-fft.workspace = true

# Math and DSP
half.workspace = true

# Audio
hound.workspace = true
symphonia.workspace = true
# Optional audio encoders (libopus / LAME are C-FFI; FLAC is Pure-Rust via
# OxiAudio) — gated behind the default-OFF `ffi-codecs` feature.
opus = { workspace = true, optional = true }
# Pure-Rust FLAC encoding (OxiAudio, FLAC via flacenc) — replaces C-FFI flac-bound.
oxiaudio-core = { workspace = true, optional = true }
oxiaudio-encode = { workspace = true, optional = true }
mp3lame-encoder = { workspace = true, optional = true }
mp4.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
oxicode.workspace = true
toml.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Async support
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-stream.workspace = true
chrono.workspace = true

# Random number generation
fastrand.workspace = true

# Cryptographic hashing
md5.workspace = true

# System info
num_cpus.workspace = true

# Lock-free data structures
crossbeam-utils.workspace = true
parking_lot.workspace = true

# Static initialization
once_cell.workspace = true

# Real-time audio drivers
cpal.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[features]
default = ["candle"]
# candle-core/candle-nn are now hard dependencies (see above), so this
# feature no longer controls whether the crate *links* candle - it is always
# linked. It is kept (non-empty, unlike voirs-acoustic's now-fully-unified
# equivalent) because a large fraction of the model code
# (models/{bigvgan,univnet,hifigan}/*, backends/candle.rs, ...) still uses
# `#[cfg(feature = "candle")]`, in two different ways depending on the
# module: some (backends/candle.rs, models/hifigan/*) pair it with a real
# `cfg(not(feature = "candle"))` fallback/stub implementation of the same
# type, so disabling the feature switches to that fallback; others
# (models/bigvgan/*, models/univnet/generator+lvc) have no fallback at all -
# disabling the feature compiles the candle-backed type out entirely (the
# gate is on the `use`/re-export, not an alternate implementation). Either
# way it does not remove the candle-core/candle-nn dependency itself.
# Existing `--features candle` usages (this crate's own
# [[example]]/[[bench]] entries, downstream Cargo.toml files) keep resolving
# unchanged.
candle = []
# Optional audio encoders: Opus (libopus, C-FFI), LAME MP3 (C-FFI), and
# Pure-Rust FLAC (OxiAudio, via flacenc). OFF by default so the default build
# stays Pure Rust (COOLJAPAN Pure-Rust policy). Enables MP3 / Opus / compressed
# FLAC encoding of vocoder output.
ffi-codecs = ["dep:opus", "dep:oxiaudio-core", "dep:oxiaudio-encode", "dep:mp3lame-encoder"]
onnx = ["dep:oxionnx"]
gpu = ["metal", "oxionnx?/gpu"]  # On macOS, use Metal; on Linux/Windows would use cuda
cuda = ["candle-core/cuda", "oxionnx?/gpu"]
metal = ["dep:metal-rs"]  # Only available on macOS
coreml = []  # oxionnx does not have a separate coreml feature; GPU via oxionnx/gpu
asio = ["cpal/asio"]  # Windows ASIO low-latency audio (requires ASIO SDK)

[target.'cfg(target_os = "macos")'.dependencies]
metal-rs = { version = "0.27", optional = true, package = "metal" }

[[example]]
name = "vocoder_performance_profiling"
path = "examples/vocoder_performance_profiling.rs"

[[example]]
name = "vocoder_streaming_synthesis"
path = "examples/vocoder_streaming_synthesis.rs"

[[bench]]
name = "rtf_benchmark"
harness = false

[[bench]]
name = "latency_benchmark" 
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "diffusion_sampling_benchmark"
harness = false

[lints]
workspace = true
