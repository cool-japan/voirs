[package]
name = "voirs-vocoder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/voirs-vocoder"
keywords = ["voirs", "vocoder", "hifi-gan", "neural-audio", "waveform"]
categories = ["multimedia::audio", "science", "algorithms"]
rust-version.workspace = true
description = "Neural vocoder inference for VoiRS (HiFi-GAN/DiffWave)"
readme = "README.md"

[lib]
name = "voirs_vocoder"
crate-type = ["lib"]

[dependencies]
# ML/Tensor libraries
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
oxionnx = { workspace = true, optional = true }
safetensors.workspace = true
hf-hub.workspace = true

# SciRS2 - Optimized DSP and signal processing
scirs2-core.workspace = true
scirs2-fft.workspace = true

# Math and DSP
half.workspace = true

# Audio
hound.workspace = true
symphonia.workspace = true
opus.workspace = true
flac-bound.workspace = true
mp3lame-encoder.workspace = true
mp4.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
oxicode.workspace = true
toml.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Async support
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-stream.workspace = true
chrono.workspace = true

# Random number generation
fastrand.workspace = true

# Cryptographic hashing
md5.workspace = true

# System info
num_cpus.workspace = true

# Lock-free data structures
crossbeam-utils.workspace = true
parking_lot.workspace = true

# Static initialization
once_cell.workspace = true

# Real-time audio drivers
cpal.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn"]
onnx = ["dep:oxionnx"]
gpu = ["metal", "oxionnx?/gpu"]  # On macOS, use Metal; on Linux/Windows would use cuda
cuda = ["candle-core?/cuda", "oxionnx?/gpu"]
metal = ["dep:metal-rs"]  # Only available on macOS
coreml = []  # oxionnx does not have a separate coreml feature; GPU via oxionnx/gpu
asio = ["cpal/asio"]  # Windows ASIO low-latency audio (requires ASIO SDK)

[target.'cfg(target_os = "macos")'.dependencies]
metal-rs = { version = "0.27", optional = true, package = "metal" }

[[example]]
name = "vocoder_performance_profiling"
path = "examples/vocoder_performance_profiling.rs"

[[example]]
name = "vocoder_streaming_synthesis"
path = "examples/vocoder_streaming_synthesis.rs"

[[bench]]
name = "rtf_benchmark"
harness = false

[[bench]]
name = "latency_benchmark" 
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "diffusion_sampling_benchmark"
harness = false

[lints]
workspace = true
