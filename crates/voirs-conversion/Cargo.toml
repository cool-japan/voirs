[package]
name = "voirs-conversion"
version.workspace = true
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/voirs-conversion"
keywords = ["voirs", "conversion", "voice-conversion", "real-time", "audio"]
categories = ["multimedia::audio", "science", "asynchronous"]
rust-version.workspace = true
description = "Real-time voice conversion system for VoiRS"
readme = "README.md"

[dependencies]
# SciRS2 - Scientific computing abstractions
scirs2-core = { workspace = true }
scirs2-fft = { workspace = true }

# Core ML and tensor operations
candle-core = { workspace = true }
candle-nn = { workspace = true }

# Real-time audio processing
cpal = { workspace = true }
dasp = { workspace = true }

# Async and concurrency
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling and utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Math and random
fastrand = { workspace = true }
num_cpus = { workspace = true }

# Time and synchronization
parking_lot = { workspace = true }
crossbeam-utils = { workspace = true }
chrono = { workspace = true }

# ONNX Runtime (optional)
oxionnx = { workspace = true, optional = true }

# Compression for cache optimization
oxiarc-deflate = { workspace = true }

# Audio file I/O
hound = { workspace = true }

# Multi-format audio codec support (pure Rust)
claxon = { workspace = true }
symphonia = { workspace = true }
lewton = { workspace = true }
ogg = { workspace = true }
oxiaudio-core = { workspace = true }
oxiaudio-encode = { workspace = true }

# C-backed codecs (optional, not in default features)
minimp3 = { workspace = true, optional = true }
mp3lame-encoder = { workspace = true, optional = true }
opus = { workspace = true, optional = true }

# HTTP client for IoT cloud connectivity
reqwest = { workspace = true, features = ["json", "rustls-no-provider"], optional = true }
# Pure-Rust TLS provider (rustls + RustCrypto) — installed before IoT TLS handshakes
oxitls-adapter-rustls-rustcrypto = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

# VoiRS dependencies
voirs-acoustic = { workspace = true, optional = true }
voirs-cloning = { workspace = true, optional = true }
voirs-emotion = { workspace = true, optional = true }
voirs-spatial = { workspace = true, optional = true }

# WebAssembly dependencies
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "console",
    "AudioContext",
    "AudioContextState",
    "AudioBuffer",
    "AudioDestinationNode",
    "AudioNode",
    "GainNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "Performance",
    "Window",
    "Document",
    "Navigator",
] }
# getrandom 0.3 renamed the former `js` feature to `wasm_js`.
# The old `js` feature caused a resolver error after cargo upgrade.
# If targeting wasm32-unknown-unknown, remember to also set:
#   RUSTFLAGS='--cfg getrandom_backend="wasm_js"'
# (The feature alone only makes the backend available.)
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
# Also add getrandom 0.2 with js feature for transitive dependencies from scirs2-core
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = "3.27"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["real-time"]
real-time = []
acoustic-integration = ["voirs-acoustic"]
cloning-integration = ["voirs-cloning"]
emotion-integration = ["voirs-emotion"]
spatial-integration = ["voirs-spatial"]
gpu = ["oxionnx?/gpu"]
cuda = ["candle-core/cuda"]
onnx = ["dep:oxionnx"]
metal = ["dep:metal-rs"]
streaming = ["real-time"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "serde-wasm-bindgen", "js-sys", "web-sys", "getrandom", "getrandom_v2"]
iot = ["reqwest", "dep:oxitls-adapter-rustls-rustcrypto", "dep:rustls"]
all-integrations = ["acoustic-integration", "cloning-integration", "emotion-integration", "spatial-integration"]
ffi-codecs = ["dep:minimp3", "dep:mp3lame-encoder", "dep:opus"]


[target.'cfg(target_os = "macos")'.dependencies]
metal-rs = { version = "0.27", optional = true, package = "metal" }

[lints]
workspace = true
