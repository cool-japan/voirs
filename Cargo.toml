[workspace]
resolver = "2"
members = [
    "crates/voirs-g2p",
    "crates/voirs-acoustic",
    "crates/voirs-vocoder",
    "crates/voirs-dataset",
    "crates/voirs-cli",
    "crates/voirs-ffi",
    "crates/voirs-sdk",
    "crates/voirs-recognizer",
    "crates/voirs-evaluation",
    "crates/voirs-feedback",
    "crates/voirs-emotion",
    "crates/voirs-cloning",
    "crates/voirs-conversion",
    "crates/voirs-singing",
    "crates/voirs-spatial",
    "crates/voirs-integration-tests",
    "examples",
]
default-members = [
    "crates/voirs-g2p",
    "crates/voirs-acoustic",
    "crates/voirs-vocoder",
    "crates/voirs-dataset",
    "crates/voirs-cli",
    "crates/voirs-ffi",
    "crates/voirs-sdk",
    "crates/voirs-recognizer",
    "crates/voirs-evaluation",
    "crates/voirs-feedback",
    "crates/voirs-emotion",
    "crates/voirs-cloning",
    "crates/voirs-conversion",
    "crates/voirs-singing",
    "crates/voirs-spatial",
    "crates/voirs-integration-tests",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
authors = ["Tetsuya Kitahata <tetsuya@cool-japan.co.jp>"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/voirs"
homepage = "https://github.com/cool-japan/voirs"
documentation = "https://docs.rs/voirs"
keywords = ["tts", "speech", "synthesis", "neural", "rust"]
categories = ["multimedia::audio", "science", "algorithms"]
rust-version = "1.89"

[workspace.dependencies]
# SciRS2 Ecosystem - Scientific computing abstractions
# POLICY: All VoiRS crates MUST use scirs2-core abstractions (see SCIRS2_INTEGRATION_POLICY.md)
scirs2-core = { version = "0.4.1", features = ["array", "random", "simd", "parallel"] }
scirs2-fft = { version = "0.4.1", features = ["rustfft-backend"] }

# NumRS2 - NumPy-like numerical computing (for numpy .npz file support)
numrs2 = "0.3.2"

# Internal VoiRS crates
voirs-g2p = { version = "0.1.0-rc.1", path = "crates/voirs-g2p" }
voirs-acoustic = { version = "0.1.0-rc.1", path = "crates/voirs-acoustic" }
voirs-vocoder = { version = "0.1.0-rc.1", path = "crates/voirs-vocoder" }
voirs-dataset = { version = "0.1.0-rc.1", path = "crates/voirs-dataset" }
voirs-sdk = { version = "0.1.0-rc.1", path = "crates/voirs-sdk" }
voirs-cli = { version = "0.1.0-rc.1", path = "crates/voirs-cli" }
voirs-ffi = { version = "0.1.0-rc.1", path = "crates/voirs-ffi" }
voirs-recognizer = { version = "0.1.0-rc.1", path = "crates/voirs-recognizer" }
voirs-evaluation = { version = "0.1.0-rc.1", path = "crates/voirs-evaluation" }
voirs-feedback = { version = "0.1.0-rc.1", path = "crates/voirs-feedback" }
voirs-emotion = { version = "0.1.0-rc.1", path = "crates/voirs-emotion" }
voirs-cloning = { version = "0.1.0-rc.1", path = "crates/voirs-cloning" }
voirs-conversion = { version = "0.1.0-rc.1", path = "crates/voirs-conversion" }
voirs-singing = { version = "0.1.0-rc.1", path = "crates/voirs-singing" }
voirs-spatial = { version = "0.1.0-rc.1", path = "crates/voirs-spatial" }

# Core tensor/ML libraries
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
oxionnx = "0.1.2"
safetensors = "0.7.0"
hf-hub = "0.5.0"
openssl = "0.10"  # Transitively needed by hf-hub via native-tls; system openssl used (installed via before-script-linux)
tract-onnx = "0.22.1"  # ONNX model loading and inference
tract-core = "0.22.1"  # Core tract functionality for ONNX conversion

# Audio processing
hound = "3.5.1"
cpal = "0.17.3"
dasp = "0.11"
claxon = "0.4"  # FLAC decoding
flac-bound = "0.5"  # FLAC encoding/decoding
symphonia = "0.5.5"  # Comprehensive audio codec support
opus = "0.3"  # Opus audio codec
lewton = "0.10"  # OGG Vorbis decoding
minimp3 = "0.6"  # MP3 decoding
mp3lame-encoder = "0.2"  # MP3 encoding
mp4 = "0.14"  # MP4 container support

# DSP and math
# NOTE: ndarray and num-complex removed - use scirs2-core::ndarray and scirs2-core::numeric
oxifft = "0.2.0"
# NOTE: wide and simba kept for direct SIMD in specific optimized paths (non-array operations)
wide = "1.2.0"  # SIMD processing
simba = "0.9"  # SIMD abstractions

# Text processing
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

# Async/concurrency
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
# NOTE: rayon removed - use scirs2-core::parallel_ops

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
oxicode = { version = "0.2", features = ["serde"] }
ordered-float = "5.1"

# CLI and utilities
clap = { version = "4.6.0", features = ["derive"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Add extra dependencies
toml = "1.0"
fastrand = "2.3"  # For simple random needs (non-statistical)
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# NOTE: rand removed - use scirs2-core::random for statistical distributions
uuid = { version = "1.22", features = ["v4", "serde", "js"] }

# Additional CLI dependencies
indicatif = "0.18"
console = "0.16"
dialoguer = "0.12"
clap_complete = "4.6"
lru = "0.16.3"

# Terminal UI dependencies
ratatui = "0.30.0"
crossterm = "0.29.0"

reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["json", "query", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip", "limit", "request-id"] }
hyper = { version = "1.8", features = ["full"] }
oxiarc-deflate = { version = "0.2.5", path = "../oxiarc/oxiarc-deflate" }
oxiarc-zstd = "0.2.5"
oxiarc-archive = "0.2.5"
oxiarc-bzip2 = "0.2.5"
csv = "1.4"
walkdir = "2.5"
glob = "0.3"
tempfile = "3.27"
libc = "0.2.183"
once_cell = "1.21"
num_cpus = "1.17"

# Windows API support
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
sha2 = "0.10"
aes-gcm = "0.10"
regex = "1.12"
memmap2 = "0.9"
thread_local = "1.1"
pin-project = "1.1"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
fst = "0.4"

# WebAssembly dependencies
wasm-bindgen = { version = "0.2.114", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.91", features = ["console", "AudioContext", "AudioBuffer", "AudioBufferOptions", "AudioBufferSourceNode", "AudioDestinationNode"] }
js-sys = "0.3.91"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
getrandom = { version = "0.4", features = ["js"] }  # Required for WASM support (transitive dependency from scirs2-core)

# FFI dependencies
pyo3 = "0.28.2"
numpy = "0.28.0"
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }  # Using maintained fork for pyo3 0.26 compatibility
parking_lot = "0.12"
flume = "0.12"
backtrace = "0.3"
md5 = "0.8"

# Lock-free data structures
crossbeam-utils = "0.8"
semver = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
dirs = "6.0"

# Test dependencies
tokio-test = "0.4"
wasm-bindgen-test = "0.3.64"

# File system watching
notify = "8.2.0"

# Dynamic loading and plugin support
libloading = "0.9"
wasmtime = "43.0.0"

# Data format support
parquet = "58.0.0"
arrow = "58.0.0"
half = "2.7"  # F16 support for Whisper
bytemuck = "1.25"  # Safe byte casting for SafeTensors
# NOTE: nalgebra removed - use scirs2-core::linalg when needed
proptest = "1.10"

# Music processing
musicxml = "1.1.2"
midly = "0.5.3"

# Platform-specific dependencies
winapi = { version = "0.3", features = ["processthreadsapi", "psapi", "winnt", "handleapi"] }

# GPU/OpenCL support
opencl3 = "0.12.3"

# HTTP/Web dependencies
mime = "0.3"
tokio-tungstenite = "0.29"


[patch.crates-io]
# On macOS (and any system without a CUDA toolchain) the upstream
# candle-kernels build.rs calls nvidia-smi unconditionally and panics,
# and the upstream cudarc build.rs panics when nvcc is absent.
# These local patches replace the build scripts with graceful fallbacks
# so that CPU-only compilation and tests work without a CUDA toolkit.
# GPU operations will panic at runtime with a clear message.
candle-kernels = { path = "patches/candle-kernels" }
cudarc = { path = "patches/cudarc" }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release-gpu]
inherits = "release"
opt-level = 3
lto = "fat"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unused_imports = "allow"
dead_code = "allow"
unused_variables = "allow"
unused_mut = "allow"
deprecated = "allow"

[workspace.lints.clippy]
missing_docs_in_private_items = "allow"
derivable_impls = "allow"
field_reassign_with_default = "allow"
len_zero = "allow"
manual_range_contains = "allow"
useless_vec = "allow"
absurd_extreme_comparisons = "allow"
