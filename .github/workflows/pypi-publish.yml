# PyPI Publishing Workflow for VoiRS
# Builds and publishes Python wheels to PyPI using maturin

name: PyPI Publish

on:
  # Manual trigger for publishing
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - none
      version_tag:
        description: 'Version tag (e.g., v0.1.0)'
        required: false
        type: string

  # Trigger on release tags
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: "1.8"

jobs:
  # Build wheels for Linux (x86_64, aarch64)
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            manylinux: auto
            aws_lc_no_asm: ""
            extra_args: ""
          - target: aarch64
            manylinux: manylinux_2_28
            aws_lc_no_asm: "1"
            extra_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          AWS_LC_SYS_NO_ASM: ${{ matrix.aws_lc_no_asm }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter ${{ matrix.extra_args }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/voirs-ffi
          before-script-linux: |
            yum install -y clang lld || true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/voirs-ffi/dist

  # Build wheels for macOS (x86_64 and arm64)
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Create cmake policy wrapper
        run: |
          CMAKE_BIN=$(which cmake)
          {
            echo '#!/bin/bash'
            echo '# Only inject -DCMAKE_POLICY_VERSION_MINIMUM=3.5 for configure steps, not --build/--install/-E'
            echo 'for arg in "$@"; do'
            echo '  case "$arg" in'
            echo '    --build|--install|-E) exec "'"$CMAKE_BIN"'" "$@" ;;'
            echo '  esac'
            echo 'done'
            echo 'exec "'"$CMAKE_BIN"'" "$@" -DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          } > /tmp/cmake-wrapper.sh
          chmod +x /tmp/cmake-wrapper.sh

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CMAKE: /tmp/cmake-wrapper.sh
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: crates/voirs-ffi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/voirs-ffi/dist

  # Build wheels for Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          working-directory: crates/voirs-ffi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: crates/voirs-ffi/dist

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/voirs-ffi

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/voirs-ffi/dist

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/voirs-ffi/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List dist contents
        run: ls -la dist/

      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
