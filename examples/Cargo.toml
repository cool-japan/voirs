[dependencies]
voirs-integration-tests = { workspace = true }
voirs-g2p = { workspace = true }
voirs-acoustic = { workspace = true, features = ["onnx"] }
voirs-vocoder = { workspace = true }
voirs-sdk = { workspace = true, features = ["emotion", "cloning", "conversion", "singing", "spatial"] }
voirs-recognizer = { workspace = true, features = ["whisper-pure"] }
voirs-evaluation = { workspace = true }
voirs-feedback = { workspace = true, features = ["gamification"] }
voirs-singing = { workspace = true }
voirs-spatial = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
sysinfo = "0.39"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
scirs2-core = { workspace = true }  # For random number generation (replaced rand)
fastrand = { workspace = true }     # For simple random simulation in examples
thiserror = { workspace = true }
num_cpus = { workspace = true }
md5 = { workspace = true }
regex = { workspace = true }
crossbeam = "0.8"

[features]
onnx = ["voirs-acoustic/onnx"]
gamification = ["voirs-feedback/gamification"]

# WebAssembly dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "Window",
  "Document"
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
